<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Smithy Maths Practice</title>
<style>

<script>
"use strict";
/* ---------- Storage (saved in this browser only) ---------- */
const KEY='smithy_maths_practice_v1';let D={tests:[],last:'',board:'Pearson Edexcel'};
try{Object.assign(D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PUP=[1,2,4,5],DIFF=['Easy','Moderate','Difficult','Very Difficult'],SUBJ='Maths';
const BOARDS=['Pearson Edexcel','AQA','OCR','WJEC/Eduqas'];
const ICON={'Indices and Surds':'√','Quadratics':'x²','Sequences':'1, 4, 9…','Algebraic Fractions':'a/b','Mixed':'🎲'};
function rng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;const r=(a,b)=>a+Math.floor(R()*(b-a+1));
const Q=(q,a,m,w,o)=>({q,a,m,w,...o});
const sup=(b,n)=>`${b}<sup>${n}</sup>`;
const sg=n=>n<0?`− ${-n}`:`+ ${n}`;
const P=(...c)=>{let s='';c.forEach((k,i)=>{const p=c.length-1-i;if(!k)return;const a=Math.abs(k),m=p?(a==1?'':a)+'x'+(p==2?'²':p==3?'³':''):a;s+=(k<0?'-':s?'+':'')+m});return s||'0'};
const fx=s=>s.replace(/-/g,' − ').replace(/\+/g,' + ').replace(/^ − /,'−');
const ans=q=>q.d!=null?q.d:Array.isArray(q.a)?q.a.join(' or '):q.a;
const pick=a=>a[r(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const frac=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return d==1?`${n}`:`${n}/${d}`};
const QF=(q,n,d,m,w,o)=>Q(q,n/d,m,w,{d:frac(n,d),...o});
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const bk=a=>`(x ${sg(a)})`;
const cf=k=>k==1?'':k;
const BANK={'Maths':{}};
/* ---------- Answer checking ---------- */
const num=s=>{s=String(s).toLowerCase().trim().replace(/−/g,'-');const mx=s.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mx)return(mx[1]?-1:1)*(+mx[2]+mx[3]/mx[4]);s=s.replace(/[°%£\s,]|cm|units?|²|³/g,'').replace(/^[a-z]=/,'').replace(/[a-z]+$/,'');const m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);return m?m[1]/m[2]:/^-?\d*\.?\d+$/.test(s)?+s:NaN};
const SUPD={'⁰':0,'¹':1,'²':2,'³':3,'⁴':4,'⁵':5,'⁶':6,'⁷':7,'⁸':8,'⁹':9},supx=s=>String(s).replace(/½/g,'0.5').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+[...m].map(c=>SUPD[c]).join(''));
/* norm: ignores spaces, capitals, ×/*, and accepts sqrt(5), root5, ² and ^2 for the same thing */
const norm=s=>supx(s).toLowerCase().replace(/\s+and\s+/g,',').replace(/[\s*×]/g,'').replace(/−|–/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/sqrt|root/g,'√').replace(/√\((\d+)\)/g,'√$1').replace(/[a-z]=/g,'').replace(/^£/,'');
/* pn: compares polynomials in x or n in any term order */
const pn=s=>{s=supx(s).toLowerCase().replace(/[\s*]/g,'').replace(/²/g,'^2').replace(/³/g,'^3').replace(/−/g,'-').replace(/^[a-z]=/,'').replace(/n/g,'x');if(!/^[-+0-9x^.]+$/.test(s))return null;const m={},ts=s.match(/[+-]?[^+-]+/g);if(!ts)return null;for(const t of ts){const g=t.match(/^([+-]?)(\d*\.?\d*)(x?)(?:\^(\d+))?$/);if(!g||(!g[2]&&!g[3]))return null;m[g[3]?(g[4]?+g[4]:1):0]=(m[g[3]?(g[4]?+g[4]:1):0]||0)+(g[1]=='-'?-1:1)*(g[2]===''?1:+g[2])}return Object.keys(m).filter(k=>Math.abs(m[k])>1e-9).sort().map(k=>k+':'+m[k]).join('|')||'0'};
const nl=s=>String(s).toLowerCase().replace(/−/g,'-').replace(/±\s*(\d+(?:\.\d+)?)/,'$1,-$1').split(/[,;]|\band\b|\bor\b|\s+/).map(t=>t.replace(/[a-z=]+/g,'')).filter(Boolean).map(num);
const check=(q,v)=>Array.isArray(q.a)?(()=>{const g=nl(v).sort((a,b)=>a-b),e=[...q.a].sort((a,b)=>a-b);return g.length==e.length&&g.every((x,i)=>Math.abs(x-e[i])<0.005)})():typeof q.a==='number'?Math.abs(num(v)-q.a)<0.005:[q.a,...(q.alt||[])].some(x=>{const a=pn(x);return norm(x)===norm(v)||(a!==null&&a===pn(v))});
/* ---------- State ---------- */
let S={v:'home',name:D.last,pin:'',ok:false,stage:'login',busy:0,red:0,reds:[],board:D.board||'Pearson Edexcel',diff:-1,topic:'',src:'pdf',t:null};
const SRC={pdf:'Worksheet questions',gen:'Generated practice',all:'Both'};
const wsCount=(tp,d)=>(BANK[SUBJ][tp]||[[],[],[],[]])[d].filter(g=>g.pdf).length;
const wsTopics=()=>Object.keys(BANK[SUBJ]).filter(tp=>[0,1,2,3].some(d=>wsCount(tp,d)));
const mine=()=>D.tests.filter(t=>t.student.toLowerCase()===S.name.toLowerCase());
/* ---------- Cloud sync (Supabase). Students sign in with a name and PIN; the database function portal_sync checks the PIN,
   stores any new results and returns the student's full history and redeemed Puppies, so the dashboard is the same on every device.
   SK is the project's publishable key: it only allows calling the portal_* functions, never reading the tables directly.
   A result that cannot be uploaded (no internet) stays in this browser and is sent at the next sign-in or dashboard visit. ---------- */
const SB='https://ouagqetmnjlzhiyhhgan.supabase.co',SK='sb_publishable_dkOomTwzP18vp_n7M_atvw_fX5mICeE';
const lk=t=>String(t.student).toLowerCase()===S.name.toLowerCase();
const sync=async(tests,mk,np)=>{const n=S.name,x=await fetch(SB+'/rest/v1/rpc/portal_sync',{method:'POST',headers:{'Content-Type':'application/json',apikey:SK,Authorization:'Bearer '+SK},body:JSON.stringify({p_name:n,p_pin:S.pin,p_tests:tests,p_create:!!mk,p_new_pin:np||null})});if(!x.ok||n!==S.name)throw new Error('sync');return x.json()};
const pend=()=>D.tests.filter(t=>lk(t)&&!t.sy).map(t=>(t.uid=t.uid||t.id+'|'+t.date,t));
const take=j=>{const ids=new Set(j.tests.map(t=>t.uid));D.tests=D.tests.filter(t=>!lk(t)||(!t.sy&&!ids.has(t.uid))).concat(j.tests.map(t=>({...t,sy:1})));S.red=+j.redeemed||0;S.reds=j.redemptions||[];save()};
const push=()=>{const p=pend();if(S.ok&&p.length)sync(p).then(j=>{if(j.status=='ok')take(j)}).catch(()=>{})};
const sig=()=>mine().map(t=>t.uid+(t.sy||0)).join()+'|'+S.red;
const pull=()=>{if(!S.ok||S.busy||S.v=='test'||document.hidden)return;const b=sig();return sync(pend()).then(j=>{if(j.status!='ok')return;take(j);if(S.v=='dash'&&sig()!=b)render()}).catch(()=>{})};
setInterval(()=>{if(S.v=='dash'||S.v=='pick')pull()},30000);document.addEventListener('visibilitychange',pull);window.addEventListener('online',pull);
function cheer(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.12;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)})}catch(e){}
for(let i=0;i<28;i++){const e=document.createElement('span');e.className='cf';e.textContent=['🐶','🎉','👏','⭐'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.4+'s';document.body.append(e);setTimeout(()=>e.remove(),2300)}}
const KEYS=['√','²','^','/','(',')','−'];
const hintFor=q=>q.h||(typeof q.a==='number'?'Type a number. Fractions like 3/4 and negative numbers like -5 are fine.':Array.isArray(q.a)?'Give every answer, separated by "or" or a comma.':'Type powers with ^ (e.g. x^2). Use the buttons for √ and brackets.');
/* ---------- AI explanations (Claude, through the explain-ai Supabase Edge Function) ---------- */
const plain=h=>{const d=document.createElement('div');d.innerHTML=String(h);d.querySelectorAll('.fr').forEach(f=>{const p=f.children;f.replaceWith(`(${p[0]?p[0].textContent:''})/(${p[1]?p[1].textContent:''})`)});d.querySelectorAll('sup').forEach(e=>e.replaceWith('^('+e.textContent+')'));return d.textContent.replace(/\s+/g,' ').trim()};
const aiHtml=t=>esc(t).split('\n').map(l=>l.trim()).filter(Boolean).map(l=>/^#+\s*/.test(l)?`<h4>${l.replace(/^#+\s*/,'')}</h4>`:`<p>${l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</p>`).join('');
const AIERR={not_configured:()=>'AI explanations are not switched on yet. Ask your teacher.',limit:j=>`You have used all ${j.limit||40} AI explanations for today. Try again tomorrow.`,auth:()=>'Please sign out and sign in again, then try once more.',locked:()=>'Too many wrong PINs. Wait 5 minutes, then try again.',change_pin:()=>'Please sign in again and choose your own PIN first.',x:()=>'The AI could not answer right now. Try again in a moment.'};
/* ---------- Views ---------- */
const V={
home:()=>S.stage=='confirm'?`<h1>Create your account</h1><div class=card><p>There is no student called <b>${esc(S.name)}</b> yet.</p><label>Type your PIN again to confirm it<input id=pn2 type=password inputmode=numeric maxlength=8 autocomplete=off></label><p class=err id=er></p><button data-a=create>Create my account</button><button class=g data-a=back0>Back</button></div>`
:S.stage=='newpin'?`<h1>Choose your own PIN</h1><div class=card><p>Hi ${esc(S.name)}! Your teacher gave you a temporary PIN. Choose your own secret PIN (4 to 8 digits) and remember it.</p><label>New PIN<input id=np1 type=password inputmode=numeric maxlength=8 autocomplete=off></label><label>New PIN again<input id=np2 type=password inputmode=numeric maxlength=8 autocomplete=off></label><p class=err id=er></p><button data-a=setpin>Save my PIN</button><button class=g data-a=back0>Back</button></div>`
:`<h1>Smithy Maths Practice</h1><p class=mu>GCSE Higher practice: Indices and Surds, Quadratics, Sequences and Algebraic Fractions, all questions from the Prasad's Tutorials worksheets. Type your answers, earn Puppies 🐶 and watch your total grow.</p><div class=card><label>Student Name<input id=nm value="${esc(S.name)}" placeholder="e.g. Smithy" autocomplete=off></label><label>PIN (4 to 8 digits)<input id=pn type=password inputmode=numeric maxlength=8 placeholder="Your secret number" autocomplete=off></label><label>Exam Board<select id=bd>${BOARDS.map(b=>`<option ${b==S.board?'selected':''}>${b}</option>`).join('')}</select></label><p class=mu>First time? Choose a PIN and remember it. Your results and Puppies are saved online, so you can carry on from any device.</p><p class=err id=er></p><button data-a=go>Sign in</button></div>`,
pick:()=>{const tp=Object.keys(BANK[SUBJ]),ready=S.diff>=0&&S.topic,ws=wsTopics(),sub=t=>{if(S.src!='pdf')return'';if(t=='Mixed')return`<small>${ws.join(', ')}</small>`;const n=[0,1,2,3].reduce((s,d)=>s+wsCount(t,d),0);return`<small>📄 ${n} worksheet questions</small>`};
return `<h1>Choose your practice</h1><p class=mu>Student: ${esc(S.name)} · Exam board: ${esc(S.board)}</p><div class=card><h2>Topic</h2><div class=tp>${tp.concat('Mixed').map(t=>`<button class="chip ${S.topic==t?'on':''}" data-a=top data-v="${esc(t)}"><b>${ICON[t]||''}</b>${t=='Mixed'?'Mixed (all four topics)':t}${sub(t)}</button>`).join('')}</div><h2>Difficulty</h2><div class=chips>${DIFF.map((d,i)=>`<button class="chip ${S.diff==i?'on':''}" data-a=diff data-v=${i}>${d}<small>🐶 ${PUP[i]} ${PUP[i]>1?'Puppies':'Puppy'} per correct answer${S.src=='pdf'&&S.topic&&S.topic!='Mixed'&&wsCount(S.topic,i)?` · 📄 ${wsCount(S.topic,i)} questions`:''}</small></button>`).join('')}</div><button data-a=start ${ready?'':'disabled'}>Start test</button><button class=g data-a=home>Change student</button></div>`},
